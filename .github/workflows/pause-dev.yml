name: Pause AWS dev

on:
  workflow_dispatch:
  push:
    branches: [phase-m0-docs]
    paths:
      - .github/workflows/pause-dev.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  TF_WORKING_DIR: infra/dev
  NAME_PREFIX: rre-dev

jobs:
  pause:
    name: Pause (scale down)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::521018312783:role/dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Scale ECS services to zero
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="api_desired_count=0" \
            -var="ui_desired_count=0" \
            -var="worker_desired_count=0" \
            -var="image_tag=latest" \
            -target=aws_ecs_service.api \
            -target=aws_ecs_service.ui \
            -target=aws_ecs_service.worker

      - name: Delete VPC endpoints (interface + S3 gateway)
        run: |
          set -euo pipefail
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          echo "Default VPC: $VPC_ID"

          # Interface endpoints tagged Name=rre-dev-* (Project=rre via default tags / CLI).
          # S3 gateway tagged Name=rre-dev-s3.
          mapfile -t EP_IDS < <(aws ec2 describe-vpc-endpoints \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "VpcEndpoints[?Tags[?Key=='Name' && starts_with(Value, '${{ env.NAME_PREFIX }}-')]].VpcEndpointId" \
            --output text | tr '\t' '\n' | sed '/^$/d' || true)

          if [[ ${#EP_IDS[@]} -eq 0 || -z "${EP_IDS[0]:-}" ]]; then
            echo "No ${{ env.NAME_PREFIX }}-* VPC endpoints to delete."
          else
            echo "Deleting VPC endpoints: ${EP_IDS[*]}"
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "${EP_IDS[@]}"
          fi

          echo "Note: temporary TF drift vs enable_vpc_endpoints=true is expected."
          echo "Deploy-dev terraform apply recreates endpoints."

      - name: Stop RDS instance
        run: |
          aws rds stop-db-instance \
            --db-instance-identifier rre-dev-postgres \
            --no-cli-pager || true
          echo "RDS stop requested (may already be stopped)."

      - name: Mark power state asleep (best-effort)
        run: |
          aws dynamodb put-item \
            --table-name "${{ env.NAME_PREFIX }}-power-state" \
            --item '{
              "pk": {"S": "POWER#STATE"},
              "state": {"S": "asleep"},
              "active_jobs": {"N": "0"},
              "idle_timer_started_at": {"NULL": true}
            }' || echo "Power state table missing or inaccessible; skip."

      - name: Summary
        run: |
          {
            echo "## RRE dev paused"
            echo "- ECS \`rre-dev-api\`, \`rre-dev-ui\`, and \`rre-dev-worker\`: desired count 0"
            echo "- VPC endpoints named \`rre-dev-*\`: delete requested (TF drift until next deploy)"
            echo "- RDS \`rre-dev-postgres\`: stop requested"
            echo ""
            echo "**Still incurring charges:** ALB (~\$16/mo), ECR storage, Secrets Manager, Lambda, DynamoDB, minimal RDS storage while stopped."
            echo ""
            echo "**Resume:** open \`/login\` (power wake) or run **Deploy to AWS dev** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
